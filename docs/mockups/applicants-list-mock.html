<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Applicants list mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#17140F;--ground-2:#1C1813;--sidebar:#120F0B;--surface:#221D17;--surface-2:#2C2620;
  --line:rgba(244,239,227,.15);--line-soft:rgba(244,239,227,.085);--track:rgba(244,239,227,.10);
  --ink:#F4EFE3;--ink-2:#C3BBA9;--ink-3:#948B7C;
  --slab:#0B2A21;--jade:#4FBF95;--jade-bright:#67E3AF;--jade-soft:rgba(79,191,149,.15);--jade-soft-fg:#6ADCAA;
  --brass:#E0B96A;--brass-line:rgba(224,185,106,.55);--amber-bg:rgba(224,170,80,.16);--amber-fg:#E4B76E;
  --crit:#E58A78;--crit-bg:rgba(217,113,95,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(79,191,149,.07),transparent 60%),
  radial-gradient(700px 500px at 10% 110%,rgba(224,185,106,.06),transparent 60%),var(--ground)}
.serif{font-family:Fraunces,Georgia,serif}
.num{font-family:Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:50;font:600 11px/1 Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);background:rgba(23,20,15,.86);border:1px solid var(--brass-line);padding:6px 9px;border-radius:999px}

/* ───────── desktop frame ───────── */
.d{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--sidebar);border-right:1px solid var(--line-soft);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--slab);border:1px solid var(--brass-line);display:grid;place-items:center;font:600 13px Fraunces;color:var(--brass);font-style:normal}
.brand b{font:500 17px Fraunces}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-size:13.5px}
.nav svg{width:17px;height:17px;opacity:.85}
.nav.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-soft)}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--jade-soft-fg);background:var(--jade-soft);padding:1px 7px;border-radius:999px}
.main{padding:28px 36px 40px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px}
.head h1{font:500 34px/1.05 Fraunces;letter-spacing:-.01em}
.head .sub{color:var(--ink-3);padding-bottom:5px}
.head .sub b{color:var(--jade-soft-fg);font-weight:500}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);font-size:13.5px}
.search svg{width:16px;height:16px}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line-soft)}
.tab{padding:10px 14px 11px;color:var(--ink-3);font-size:13.5px;position:relative;white-space:nowrap}
.tab .c{margin-left:6px;font-size:12px;color:var(--ink-3)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--jade)}
.tab.warn .c{color:var(--amber-fg)}
.bar{display:flex;align-items:center;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.pick b{color:var(--ink);font-weight:500}
.pick svg{width:13px;height:13px;opacity:.7}
.pick.set{background:var(--jade-soft);border-color:rgba(79,191,149,.45);color:var(--jade-soft-fg)}
.pick.set b{color:var(--jade-bright)}
.pick .x{margin-left:2px;opacity:.8}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px}
.pick{white-space:nowrap}
.nm .chipst{display:inline-block}
.table{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(244,239,227,.075),0 18px 40px -24px rgba(0,0,0,.6)}
.th,.tr{display:grid;grid-template-columns:minmax(260px,1.4fr) minmax(280px,1.4fr) 150px 88px 112px 18px;align-items:center;gap:18px;padding:0 20px}
.th{height:40px;color:var(--ink-3);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line-soft);background:rgba(0,0,0,.12)}
.th .r{text-align:right}
.tr{min-height:74px;border-bottom:1px solid var(--line-soft);position:relative}
.tr:last-child{border-bottom:0}
.tr.hover{background:rgba(244,239,227,.035)}
.tr.hover::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--jade)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 13px Inter;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);position:relative}
.av .dot{position:absolute;right:-1px;top:-1px;width:10px;height:10px;border-radius:50%;background:var(--jade-bright);box-shadow:0 0 0 2px var(--surface)}
.av .dot.warn{background:var(--brass)}
.nm{min-width:0}
.nm b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipst{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px;font-weight:600}
.chipst.rev{color:var(--amber-fg);background:var(--amber-bg)}
.chipst.mv{color:var(--jade-soft-fg);background:var(--jade-soft)}
.chipst.no{color:var(--crit);background:var(--crit-bg)}
.jr{min-width:0}
.strip{display:flex;align-items:center}
.n{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:grid;place-items:center;background:transparent;border:1.5px solid var(--track)}
.n svg{width:9px;height:9px;stroke:#17140F;stroke-width:3.2;fill:none}
.n.ok{background:var(--jade);border-color:var(--jade)}
.n.low{background:var(--brass);border-color:var(--brass)}
.n.now{border:2px solid var(--jade-bright);box-shadow:0 0 0 4px rgba(103,227,175,.14);background:var(--ground)}
.n.now.left{border-color:var(--ink-3);box-shadow:none}
.n.miss{border-style:dashed;border-color:var(--ink-3)}
.ln{height:2px;flex:1 1 0;min-width:8px;background:var(--track)}
.ln.ok{background:var(--jade)}
.jt{margin-top:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jt i{font-style:normal;color:var(--ink-3)}
.jt .live{color:var(--jade-soft-fg)}
.jt .left{color:var(--amber-fg)}
.act{font-size:12.5px;color:var(--ink-3)}
.act b{display:block;color:var(--ink-2);font-weight:500}
.flags{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--amber-fg)}
.flags svg{width:14px;height:14px}
.flags.none{color:var(--ink-3)}
.score{text-align:right;line-height:1}
.score .v{font-size:30px;font-weight:500}
.score .v small{font-size:13px;color:var(--ink-3);font-family:Inter;letter-spacing:0;margin-left:2px}
.score .l{display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px;font-family:Inter}
.s-hi{color:var(--jade-bright)}.s-mid{color:var(--brass)}.s-lo{color:var(--ink-2)}.s-na{color:var(--ink-3)}
.chev{color:var(--ink-3);opacity:.6}
.chev svg{width:16px;height:16px}
.tr.hover .chev{color:var(--jade-bright);opacity:1}
.foot{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;color:var(--ink-3);font-size:13px;border-top:1px solid var(--line-soft)}
.more{padding:8px 14px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:var(--surface-2);font-size:13px}
.legend{display:flex;gap:16px;margin-top:12px;color:var(--ink-3);font-size:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .n{width:12px;height:12px;flex-basis:12px}

/* ───────── phone frames ───────── */
.p{max-width:390px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.ptop{position:sticky;top:0;z-index:5;background:linear-gradient(var(--ground) 84%,rgba(23,20,15,0));padding:14px 16px 8px}
.prow{display:flex;align-items:center;gap:10px}
.prow h1{font:500 27px/1.1 Fraunces}
.prow .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.psearch{margin-top:12px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.psearch svg{width:16px;height:16px}
.ptabs{display:flex;gap:6px;overflow:hidden;margin:12px -16px 0;padding:0 16px}
.ptab{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-soft)}
.ptab.on{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:500}
.ptab .c{opacity:.7;margin-left:4px}
.pbar{display:flex;gap:8px;margin-top:10px}
.pbar .pick{flex:1;justify-content:center;padding:9px 10px}
.pbar .pick .badge{background:var(--jade);color:#17140F;border-radius:999px;font-size:11px;font-weight:600;padding:0 6px;margin-left:2px}
.pcount{padding:6px 16px 8px;color:var(--ink-3);font-size:12.5px}
.cards{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 13px;box-shadow:inset 0 1px 0 rgba(244,239,227,.06)}
.card .top{display:flex;gap:11px;align-items:center}
.card .score{margin-left:auto}
.card .score .v{font-size:27px}
.card .strip{margin-top:13px}
.card .jt{margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.card .jt .flags{flex:0 0 auto}
.dock{position:fixed;left:0;right:0;bottom:0;height:72px;background:#120F0B;border-top:1px solid var(--line-soft);display:flex;justify-content:space-around;align-items:center;max-width:390px;margin:0 auto}
.dock a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.dock a svg{width:20px;height:20px}
.dock a.on{color:var(--jade-bright)}

/* filter sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--slab) 22%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:390px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 16px 16px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.7)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:500 21px Fraunces;display:flex;align-items:center}
.sheet h2 span{margin-left:auto;font:500 13px Inter;color:var(--jade-soft-fg)}
.grp{margin-top:16px}
.grp .gl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.o{padding:7px 11px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--ink-2);background:var(--ground-2)}
.o.on{background:var(--jade-soft);border-color:rgba(79,191,149,.5);color:var(--jade-bright);font-weight:500}
.o .c{color:var(--ink-3);margin-left:4px;font-size:12px}
.o.on .c{color:var(--jade-soft-fg)}
.sbtns{display:flex;gap:10px;margin-top:20px}
.sbtns .clear{flex:0 0 auto;padding:13px 16px;border-radius:12px;color:var(--ink-2);background:var(--surface-2)}
.sbtns .go{flex:1;padding:13px 16px;border-radius:12px;background:var(--jade);color:#17140F;font-weight:600;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STEPS = ["Application","Skills check","Computer and connection","Typing test","Player chat practice","Written interview","Decision"];
// state per step: ok | low (done, below a bar) | now | left | miss (skipped) | "" (not reached)
const PEOPLE = [
  {n:"Maria Reyes", i:"MR", loc:"Cebu, Philippines", ap:"2 h ago", st:["ok","ok","ok","ok","ok","ok","now"], at:"Finished every test", tag:"rev", score:86, act:"Done 40 min ago", flags:0},
  {n:"Daniel Okafor", i:"DO", loc:"Lagos, Nigeria", ap:"5 h ago", st:["ok","ok","ok","ok","now","",""], at:"Player chat practice", live:true, score:78, sofar:true, act:"Active now", flags:1},
  {n:"Ayesha Siddiqui", i:"AS", loc:"Lahore, Pakistan", ap:"Yesterday", st:["ok","ok","ok","ok","ok","ok","now"], at:"Finished every test", tag:"rev", score:74, act:"Done yesterday", flags:2},
  {n:"Grace Wanjiru", i:"GW", loc:"Nairobi, Kenya", ap:"Yesterday", st:["ok","ok","low","ok","ok","ok","ok"], at:"Moved to interview", tag:"mv", score:71, act:"Interview Thu 3 PM", flags:0},
  {n:"Jomar Castillo", i:"JC", loc:"Davao, Philippines", ap:"3 h ago", st:["ok","ok","ok","now","","",""], at:"Typing test", live:true, score:64, sofar:true, act:"Active 2 min ago", flags:0},
  {n:"Luis Hernández", i:"LH", loc:"Guadalajara, Mexico", ap:"Yesterday", st:["ok","ok","ok","low","left","",""], at:"Left at chat practice, reply 3", leftNote:true, score:58, sofar:true, act:"Last active 20 h ago", flags:3, warn:true},
  {n:"Fatima Bello", i:"FB", loc:"Abuja, Nigeria", ap:"2 days ago", st:["ok","ok","ok","ok","ok","ok","now"], at:"Finished every test", tag:"rev", score:55, act:"Done 2 days ago", flags:1},
  {n:"Kevin Tan", i:"KT", loc:"Manila, Philippines", ap:"40 min ago", st:["ok","now","","","","",""], at:"Skills check · question 6 of 10", live:true, score:null, act:"Active now", flags:0},
  {n:"Sana Riaz", i:"SR", loc:"Karachi, Pakistan", ap:"2 days ago", st:["ok","ok","low","low","ok","ok","ok"], at:"Declined", tag:"no", score:41, act:"Decided Mon", flags:4},
  {n:"Peter Mwangi", i:"PM", loc:"Mombasa, Kenya", ap:"6 h ago", st:["ok","ok","now","","","",""], at:"Computer and connection", live:false, score:null, act:"Last active 1 h ago", flags:0, leftNote:false, waiting:true},
];
const TAGS = {rev:["Needs review","rev"], mv:["Interview","mv"], no:["Declined","no"]};
const ico = {
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M12 8v4M12 15.5v.5"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  sort:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="12" height="12"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const navIco = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  ppl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.7c1.9.8 3.1 2.6 3.5 5.3"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A2.5 2.5 0 0111 3h2a2.5 2.5 0 012.5 2.5V7"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
};
function strip(st){
  let h='';
  st.forEach((s,k)=>{
    if(k>0) h+=`<div class="ln ${st[k-1]==='ok'||st[k-1]==='low' ? (s?'ok':'') : ''}"></div>`;
    const cls = s==='ok'?'ok':s==='low'?'low':s==='now'?'now':s==='left'?'now left':s==='miss'?'miss':'';
    h+=`<div class="n ${cls}" title="${STEPS[k]}">${s==='ok'||s==='low'?ico.check:''}</div>`;
  });
  return `<div class="strip">${h}</div>`;
}
function stepNo(p){const k=p.st.findIndex(s=>s==='now'||s==='left');return k<0?7:k+1}
function where(p){
  const tag=p.tag?``:'';
  if(p.leftNote) return `<span class="left">${p.at}</span>`;
  if(p.tag) return `${p.at}`;
  if(p.waiting) return `${p.at} <i>· step ${stepNo(p)} of 7 · not started</i>`;
  return `${p.at} <i>· step ${stepNo(p)} of 7</i>${p.live?' · <span class="live">live</span>':''}`;
}
function scoreCell(p){
  if(p.score==null) return `<div class="score"><span class="v num s-na">—</span><span class="l">not scored yet</span></div>`;
  const c=p.score>=70?'s-hi':p.score>=50?'s-mid':'s-lo';
  return `<div class="score"><span class="v num ${c}">${p.score}<small>/100</small></span>${p.sofar?'<span class="l">so far</span>':''}</div>`;
}
function flags(p){return p.flags?`<span class="flags">${ico.shield}${p.flags} flag${p.flags>1?'s':''}</span>`:`<span class="flags none">None</span>`}
function tagChip(p){return p.tag?`<span class="chipst ${TAGS[p.tag][1]}">${TAGS[p.tag][0]}</span>`:''}

function desktop(){
  const rows=PEOPLE.map((p,k)=>`
  <div class="tr ${k===1?'hover':''}">
    <div class="who"><div class="av">${p.i}${p.live?'<span class="dot"></span>':''}</div>
      <div class="nm"><b>${p.n}${tagChip(p)}</b><span>${p.loc} · applied ${p.ap}</span></div></div>
    <div class="jr">${strip(p.st)}<div class="jt">${where(p)}</div></div>
    <div class="act"><b>${p.act.split(' ')[0]==='Active'?'<span style="color:var(--jade-soft-fg)">'+p.act+'</span>':p.act}</b></div>
    <div>${flags(p)}</div>
    ${scoreCell(p)}
    <div class="chev">${ico.right}</div>
  </div>`).join('');
  return `<span class="tag">Proposed layout · desktop</span>
  <div class="d">
    <aside class="side">
      <div class="brand"><i>H</i><b>HireFlow</b></div>
      <a class="nav">${navIco.dash}Dashboard</a>
      <a class="nav on">${navIco.ppl}Applicants<span class="count">8 new</span></a>
      <a class="nav">${navIco.bag}Jobs</a>
      <a class="nav">${navIco.cal}Interviews</a>
      <a class="nav">${navIco.msg}Messages</a>
      <a class="nav">${navIco.chart}Analytics</a>
    </aside>
    <main class="main">
      <div class="head">
        <h1>Applicants</h1>
        <div class="sub">105 applied · <b>Customer Support Chat Agent</b></div>
        <div class="search">${ico.search}Search a name, email or country</div>
      </div>
      <div class="tabs">
        <button class="tab on">All<span class="c">105</span></button>
        <button class="tab warn">Needs review<span class="c">8</span></button>
        <button class="tab">Taking tests now<span class="c">6</span></button>
        <button class="tab">Part-way<span class="c">31</span></button>
        <button class="tab">Finished every test<span class="c">14</span></button>
        <button class="tab">Interview<span class="c">5</span></button>
        <button class="tab">Declined<span class="c">41</span></button>
      </div>
      <div class="bar">
        <span class="pick">Where they are <b>Any step</b>${ico.down}</span>
        <span class="pick set">Score <b>50 and up</b><span class="x">${ico.x}</span></span>
        <span class="pick">Flags <b>Any</b>${ico.down}</span>
        <span class="pick">Below a bar <b>Any</b>${ico.down}</span>
        <span class="pick">Country <b>All</b>${ico.down}</span>
        <span class="pick">Applied <b>Any time</b>${ico.down}</span>
        <div class="right"><span class="pick">${ico.sort}Sort <b>Score, high to low</b>${ico.down}</span></div>
      </div>
      <div class="table">
        <div class="th"><div>Applicant</div><div>Where they are</div><div>Last active</div><div>Flags</div><div class="r">Score</div><div></div></div>
        ${rows}
        <div class="foot"><span>Showing 10 of 64 · score 50 and up</span><button class="more">Show 25 more</button></div>
      </div>
      <div class="legend">
        <span><span class="n ok"></span>Done</span>
        <span><span class="n low"></span>Done, below the job's bar</span>
        <span><span class="n now"></span>On it now</span>
        <span><span class="n"></span>Not reached</span>
        <span style="margin-left:auto">Tap a row to open their full profile: every answer, test and flag.</span>
      </div>
    </main>
  </div>`;
}

function phone(){
  const cards=PEOPLE.slice(0,5).map(p=>`
  <div class="card">
    <div class="top"><div class="av">${p.i}${p.live?'<span class="dot"></span>':''}</div>
      <div class="nm"><b>${p.n}</b><span>${p.loc} · ${p.ap}</span></div>
      ${scoreCell(p)}</div>
    ${strip(p.st)}
    <div class="jt"><span>${p.tag?tagChip(p)+' <i>'+(p.tag==='rev'?'finished every test':p.tag==='mv'?'interview Thu 3 PM':'')+'</i>':''} ${p.leftNote?`<span class="left">${p.at}</span>`:p.tag?'':p.at+` <i>· step ${stepNo(p)} of 7</i>`}${p.live?' · <span class="live">live</span>':''}</span>${p.flags?flags(p):''}</div>
  </div>`).join('');
  return `<span class="tag">Proposed layout · phone</span>
  <div class="p">
    <div class="ptop">
      <div class="prow"><div><h1>Applicants</h1><div class="sub">105 applied · Chat Agent</div></div></div>
      <div class="psearch">${ico.search}Search a name, email or country</div>
      <div class="ptabs">
        <span class="ptab on">All<span class="c">105</span></span>
        <span class="ptab">Needs review<span class="c">8</span></span>
        <span class="ptab">Taking tests now<span class="c">6</span></span>
        <span class="ptab">Part-way<span class="c">31</span></span>
      </div>
      <div class="pbar">
        <span class="pick">${ico.sliders}<b>Filters</b><span class="badge">1</span></span>
        <span class="pick">${ico.sort}<b>Score</b>${ico.down}</span>
      </div>
    </div>
    <div class="pcount">64 applicants · score 50 and up</div>
    <div class="cards">${cards}</div>
    <nav class="dock">
      <a>${navIco.dash}Dashboard</a><a class="on">${navIco.ppl}Applicants</a><a>${navIco.bag}Jobs</a><a>${navIco.msg}Messages</a><a>${navIco.more}More</a>
    </nav>
  </div>`;
}

function phoneFilters(){
  return phone().replace('Proposed layout · phone','Proposed layout · phone · filters open') + `
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h2>Filters<span>64 match</span></h2>
    <div class="grp"><div class="gl">Where they are</div><div class="opts">
      <span class="o on">Any step</span><span class="o">Application</span><span class="o">Skills check</span><span class="o">Computer and connection</span><span class="o">Typing test</span><span class="o">Chat practice</span><span class="o">Written interview</span><span class="o">Finished every test</span></div></div>
    <div class="grp"><div class="gl">Score</div><div class="opts">
      <span class="o">Any</span><span class="o">70 and up<span class="c">22</span></span><span class="o on">50 and up<span class="c">64</span></span><span class="o">Under 50<span class="c">29</span></span><span class="o">Not scored yet<span class="c">12</span></span></div></div>
    <div class="grp"><div class="gl">Flags</div><div class="opts">
      <span class="o on">Any</span><span class="o">No flags</span><span class="o">Left the test window</span><span class="o">Tried to copy or paste</span></div></div>
    <div class="grp"><div class="gl">Below the job's bar on</div><div class="opts">
      <span class="o on">Any</span><span class="o">Typing speed</span><span class="o">Connection</span><span class="o">Ran on a phone</span></div></div>
    <div class="sbtns"><button class="clear">Clear all</button><button class="go">Show 64 applicants</button></div>
  </div>`;
}
const f=new URLSearchParams(location.search).get("frame")||"desktop";
document.getElementById("app").innerHTML = f==="phone"?phone():f==="filters"?phoneFilters():desktop();
</script>
</body>
</html>
