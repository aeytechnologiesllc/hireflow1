<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HireFlow</title>
<style>
  html, body { margin: 0; height: 100%; background: #DEE3D5; color: #1D3329; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); text-align: center; box-sizing: border-box; }
  h1 { font: 600 22px/1.3 Georgia, serif; margin: 0; }
  p { margin: 0; color: #4B5D53; max-width: 30ch; }
  button { margin-top: 6px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #0F6B4F; color: #F5F1E6; font: 600 15px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>HireFlow needs the internet. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.replace('https://staff.hireflownow.com/')">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.replace("https://staff.hireflownow.com/"); });</script>
</body>
</html>
