<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <!-- Capture password-recovery intent from the URL hash BEFORE the Supabase client (detectSessionInUrl) consumes and clears it, so /auth can show the reset form instead of bouncing to the dashboard. -->
    <script>try{window.__HF_PASSWORD_RECOVERY=/[#&]type=recovery/.test(window.location.hash);}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9" />
    <link rel="alternate icon" href="/favicon.ico?v=9" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=9" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=9" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=9" />
    <link rel="manifest" href="/site.webmanifest?v=9" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#DEE3D5" />

    <!-- Brand fonts: Fraunces (display) + Inter (UI). Loaded beside the page,
         not in front of it: a blocking stylesheet from another site held the
         first paint for one more round trip on every phone (the performance
         check, 2026-10-11). display=swap shows the text at once in the
         fallback face and swaps the brand face in when it lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- The start screen's colours before any stylesheet arrives (the app's
         own ground for its theme), so a phone shows the app at once, not a
         white page. The app opens in Day (Sage paper, 2026-10-30) whatever
         the device says; Night only when it was chosen with the moon (a saved
         "dark", or a saved "system" on a dark device). Sign-up is no longer
         held Night here (2026-10-31: it moves to the Day look). Night also
         puts the theme's own class on <html> at once, so the app's Night
         tokens hold from the first frame, not only after next-themes runs
         (data-boot goes as soon as React starts). The browser's bar
         (theme-color) is that ground too (ThemeColor in App.tsx keeps it
         with the theme): it was the old dark green, a dark strip above the
         app. The seal is BrandLoader's own, 64 px at the very centre, and
         it stamps once here; BrandLoader carries the stamp on from the same
         moment and hangs the words under it, so the loading is one screen. -->
    <script>try{var d=document.documentElement,t=localStorage.getItem("theme"),n=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);if(n){d.setAttribute("data-boot","dark");d.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#17140F");}}catch(e){}</script>
    <style>
      html,body{background:#DEE3D5;margin:0}
      html[data-boot="dark"],html[data-boot="dark"] body,html.dark{background:#17140F}
      #hf-boot{position:fixed;inset:0}
      #hf-boot svg{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;filter:drop-shadow(-1px 3px 3px rgba(10,40,28,.28));animation:hf-seal-press .6s cubic-bezier(.2,.9,.3,1.2) .1s 1 both}
      @keyframes hf-seal-press{0%{transform:scale(1.4);opacity:0}55%{transform:scale(.95);opacity:1}100%{transform:scale(1);opacity:1}}
      @media (prefers-reduced-motion:reduce){#hf-boot svg{animation:none}}
    </style>
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HireFlow" />
    
    <!-- MS Tile (Windows) -->
    <meta name="msapplication-TileColor" content="#0C2A21" />
    <title>HireFlow</title>
    <meta name="description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta name="author" content="HireFlow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="HireFlow: apply online" />
    <meta property="og:description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HireFlow" />
    <!-- The applicants' picture: never HireFlow's landing image (that one speaks to businesses).
         A careers page (/careers, /c/<slug>) and a job link get their own head from
         api/careers-prerender.mjs and api/job-prerender.mjs. -->
    <meta property="og:image" content="https://hireflownow.com/share/careers.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Now hiring: apply online" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HireFlow: apply online" />
    <meta name="twitter:description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta name="twitter:image" content="https://hireflownow.com/share/careers.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <!-- Natively JS SDK for native app bridge (push notifications, etc.) -->
    <script>function nativelyOnLoad() { window.nativelyLoaded = true; }</script>
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>

    <!-- Privacy-friendly, cookieless page-view counting. Handles this initial
         load; src/hooks/usePageViewTracking.ts calls window.__hfBeacon.track()
         for later in-app route changes. See public/beacon.js. -->
    <script src="/beacon.js" defer></script>
  </head>

  <body>
    <!-- The start screen: the app's mark (the green seal, since 2026-10-31)
         on its ground, shown the moment the page arrives and replaced by the
         app when it draws (React empties #root). It used to be an empty page
         until about a megabyte of code had run. Fades in once, never loops. -->
    <div id="root"><div id="hf-boot" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M32 3.2c4.6.3 7 2.5 11.4 3.6 4 1.1 7.8 1.4 10.4 4.6 2.8 3.3 2.5 7.1 4 11.2 1.4 3.9 3.8 6.7 3.3 11-.5 4.3-3.3 6.8-4.8 10.7-1.6 4-1.6 7.9-4.7 10.7-3.1 2.8-7.1 2.6-11.2 4-3.9 1.3-6.7 3.4-11 3-4.3-.5-6.7-3.1-10.6-4.8-3.9-1.6-7.8-1.9-10.4-5-2.6-3.1-2.3-7-3.7-10.9-1.4-3.9-3.7-6.8-3.1-11.2.6-4.2 3.6-6.5 5.3-10.2 1.7-3.9 2-7.8 5.3-10.4 3.3-2.6 7.1-2.2 11-3.4C25.6 5.1 27.6 3 32 3.2Z" fill="#0A4A35"/><circle cx="32" cy="32" r="26.5" fill="#13734F"/><circle cx="32" cy="32" r="19.5" fill="#11694C"/><circle cx="32.6" cy="32.9" r="19.5" fill="none" stroke="#3DB088" stroke-opacity=".5" stroke-width="1.6"/><circle cx="31.4" cy="31.2" r="19.5" fill="none" stroke="#06331F" stroke-opacity=".55" stroke-width="1.6"/><path d="M21.5 39.5 L27 26.5 L32.5 35.3 L42.5 23.5" transform="translate(.8 1)" fill="none" stroke="#49C094" stroke-opacity=".5" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 39.5 L27 26.5 L32.5 35.3 L42.5 23.5" fill="none" stroke="#063A27" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="21" cy="17" rx="6" ry="3" fill="#7FE0B8" opacity=".25" transform="rotate(-35 21 17)"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
