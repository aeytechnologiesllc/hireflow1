<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <!-- Capture password-recovery intent from the URL hash BEFORE the Supabase client (detectSessionInUrl) consumes and clears it, so /auth can show the reset form instead of bouncing to the dashboard. -->
    <script>try{window.__HF_PASSWORD_RECOVERY=/[#&]type=recovery/.test(window.location.hash);}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <link rel="alternate icon" href="/favicon.ico?v=7" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest?v=7" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#14120E" />

    <!-- Brand fonts: Fraunces (display) + Inter (UI). Loaded beside the page,
         not in front of it: a blocking stylesheet from another site held the
         first paint for one more round trip on every phone (the performance
         check, 2026-10-11). display=swap shows the text at once in the
         fallback face and swaps the brand face in when it lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- The start screen's colours before any stylesheet arrives (the app's
         own ground for its theme: the one chosen with the toggle, else the
         device's, and Night on sign-up), so a phone shows the app at once, not a
         white page. -->
    <script>try{var t=localStorage.getItem("theme");if(!/^\/auth(\/|$)/.test(location.pathname)&&(t==="light"||((!t||t==="system")&&matchMedia("(prefers-color-scheme: light)").matches)))document.documentElement.setAttribute("data-boot","light");}catch(e){}</script>
    <style>
      html,body{background:#17140F;margin:0}
      html[data-boot="light"],html[data-boot="light"] body{background:#F0EBDF}
      #hf-boot{position:fixed;inset:0;display:grid;place-items:center}
      #hf-boot svg{width:56px;height:56px;border-radius:14px;opacity:0;animation:hf-boot-in .4s ease-out .15s 1 forwards}
      @keyframes hf-boot-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#hf-boot svg{animation:none;opacity:1}}
    </style>
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HireFlow" />
    
    <!-- MS Tile (Windows) -->
    <meta name="msapplication-TileColor" content="#14120E" />
    <title>HireFlow</title>
    <meta name="description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta name="author" content="HireFlow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="HireFlow: apply online" />
    <meta property="og:description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HireFlow" />
    <!-- The applicants' picture: never HireFlow's landing image (that one speaks to businesses).
         A careers page (/careers, /c/<slug>) and a job link get their own head from
         api/careers-prerender.mjs and api/job-prerender.mjs. -->
    <meta property="og:image" content="https://hireflownow.com/share/careers.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Now hiring: apply online" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HireFlow: apply online" />
    <meta name="twitter:description" content="Apply for jobs online and see where your application stands. A few questions and short tests, from your phone or computer." />
    <meta name="twitter:image" content="https://hireflownow.com/share/careers.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <!-- Natively JS SDK for native app bridge (push notifications, etc.) -->
    <script>function nativelyOnLoad() { window.nativelyLoaded = true; }</script>
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>

    <!-- Privacy-friendly, cookieless page-view counting. Handles this initial
         load; src/hooks/usePageViewTracking.ts calls window.__hfBeacon.track()
         for later in-app route changes. See public/beacon.js. -->
    <script src="/beacon.js" defer></script>
  </head>

  <body>
    <!-- The start screen: the app's mark on its ground, shown the moment the
         page arrives and replaced by the app when it draws (React empties
         #root). It used to be an empty page until about a megabyte of code
         had run. Fades in once, never loops. -->
    <div id="root"><div id="hf-boot" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#14120E"/><path d="M13 46 L25 19 L37 39 L51 17" fill="none" stroke="#E0B96A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
