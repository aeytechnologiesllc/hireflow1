<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <!-- Capture password-recovery intent from the URL hash BEFORE the Supabase client (detectSessionInUrl) consumes and clears it, so /auth can show the reset form instead of bouncing to the dashboard. -->
    <script>try{window.__HF_PASSWORD_RECOVERY=/[#&]type=recovery/.test(window.location.hash);}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
    <link rel="alternate icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest?v=6" />

    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#0a0f0d" />

    <!-- Brand fonts: Fraunces (display) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Apple Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zulu Support Team" />
    
    <!-- MS Tile (Windows) -->
    <meta name="msapplication-TileColor" content="#0a2019" />
    <title>Zulu Support Team — Careers</title>
    <meta name="description" content="Remote chat support jobs with the Zulu Support Team, including team leads. All online: a few questions, a skills check, a computer check, a typing test, a chat practice and a written interview." />
    <meta name="author" content="HireFlow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Zulu Support Team — Careers" />
    <meta property="og:description" content="Remote chat support jobs with the Zulu Support Team, including team leads. All online: a few questions, a skills check, a computer check, a typing test, a chat practice and a written interview." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hireflownow.com" />
    <meta property="og:site_name" content="Zulu Support Team" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zulu Support Team — Careers" />
    <meta name="twitter:description" content="Remote chat support jobs with the Zulu Support Team, including team leads. All online: a few questions, a skills check, a computer check, a typing test, a chat practice and a written interview." />

    <!-- Additional SEO -->
    <meta name="keywords" content="hiring assistant, small business hiring, job application, candidate screening, applicant tracking" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hireflownow.com" />
    <!-- Natively JS SDK for native app bridge (push notifications, etc.) -->
    <script>function nativelyOnLoad() { window.nativelyLoaded = true; }</script>
    <script async onload="nativelyOnLoad()" src="https://cdn.jsdelivr.net/npm/natively@2.20.0/natively-frontend.min.js"></script>

    <!-- Privacy-friendly, cookieless page-view counting. Handles this initial
         load; src/hooks/usePageViewTracking.ts calls window.__hfBeacon.track()
         for later in-app route changes. See public/beacon.js. -->
    <script src="/beacon.js" defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
