<!doctype html>
<html><head><meta charset="utf-8"><title>Glyph specimen</title>
<style>
  body{margin:0;font:13px/1.3 Inter,system-ui,sans-serif;background:#F0EBDF;color:#14201B}
  .night{background:#17140F;color:#F4EFE3}
  section{padding:14px 18px}
  h2{font-family:Georgia,serif;font-weight:500;font-size:16px;margin:0 0 10px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .cell{width:112px;text-align:center;padding:6px 2px;border:1px solid rgba(0,0,0,.08);border-radius:8px}
  .night .cell{border-color:rgba(255,255,255,.12)}
  .sizes{display:flex;align-items:flex-end;justify-content:center;gap:7px;height:52px;color:#0F6B4F}
  .night .sizes{color:#4FBF95}
  .nm{font-size:9px;opacity:.75;margin-top:5px;word-break:break-word}
  .tile{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:11px;background:rgba(15,107,79,.14);border:1px solid rgba(15,107,79,.3)}
  .night .tile{background:rgba(79,191,149,.16);border-color:rgba(79,191,149,.3)}
  .stack{display:flex;flex-direction:column;gap:8px;max-width:300px}
  .card{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid rgba(0,0,0,.1);border-radius:12px}
  .night .card{border-color:rgba(255,255,255,.14)}
</style></head><body>
<div id="light"></div>
<div class="night" id="dark"></div>

function svg(body,s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+body+'</svg>';}
function build(root){
  let h='';
  for(const k in D){
    h+='<section><h2>'+k+'</h2><div class="row">';
    for(const [n,b] of D[k]){
      h+='<div class="cell"><div class="sizes">'+svg(b,16)+svg(b,20)+svg(b,24)+'<span class="tile">'+svg(b,20)+'</span></div><div class="nm">'+n+'</div></div>';
    }
    h+='</div></section>';
  }
  root.innerHTML=h;
}
build(document.getElementById('light'));
build(document.getElementById('dark'));
