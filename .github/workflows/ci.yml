name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref at a time; a new push cancels the stale one in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, typecheck, guardrails, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck ratchet (baseline may never rise)
        run: npm run typecheck:ratchet

      - name: Guardrails (static regression checks)
        run: node scripts/guardrails.mjs

      - name: Node + PGlite test suite
        run: |
          set -e
          shopt -s nullglob
          files=(scripts/*.test.mjs scripts/*pglite*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No scripts/*.test.mjs or scripts/*pglite*.mjs files found." >&2
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "::group::node $f"
            if ! node "$f"; then
              echo "FAILED: $f" >&2
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check (edge functions)
        run: node scripts/deno_check_functions.mjs
